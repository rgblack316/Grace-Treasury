# This file is a template: at container start nginx replaces ${TRUSTED_PROXY}
# with the value from .env (see docker-compose.yml).

# Login rate limit: about 10 attempts per minute per visitor IP.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 8080;
    server_name _;

    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers (sent on every response; locations that set their own add_header
    #      don't inherit these, so keep add_header out of the page/API locations) ----
    # Only the app's own scripts, styles, fonts and API. Inline styles are allowed because the UI
    # components set style attributes; blob: is for receipt previews made in the browser.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src blob:; frame-src blob:; worker-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    server_tokens off;

    # Use the visitor's real IP from Cloudflare, but ONLY when the request comes from
    # the trusted proxy (cloudflared). Anyone else sending this header is ignored.
    set_real_ip_from ${TRUSTED_PROXY};
    real_ip_header CF-Connecting-IP;

    # Login: rate-limited before it reaches the app
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many_logins;

        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @too_many_logins {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"detail":"Too many sign-in attempts. Please wait a minute and try again."}';
    }

    # Proxy API calls to the backend service
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: always fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
