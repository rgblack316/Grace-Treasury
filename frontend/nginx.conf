# This file is a template: at container start nginx replaces ${TRUSTED_PROXY}
# with the value from .env (see docker-compose.yml).

# Login rate limit: about 10 attempts per minute per visitor IP.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Use the visitor's real IP from Cloudflare, but ONLY when the request comes from
    # the trusted proxy (cloudflared). Anyone else sending this header is ignored.
    set_real_ip_from ${TRUSTED_PROXY};
    real_ip_header CF-Connecting-IP;

    # Login: rate-limited before it reaches the app
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many_logins;

        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @too_many_logins {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"detail":"Too many sign-in attempts. Please wait a minute and try again."}';
    }

    # Proxy API calls to the backend service
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: always fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
