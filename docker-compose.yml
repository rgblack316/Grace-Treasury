services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      # When set (by install.sh on new installs, or enable-db-auth.sh on existing ones), MongoDB
      # requires a login. NEVER add these to .env by hand on an existing install: MongoDB only
      # creates the accounts on an empty database, so the app would be locked out. Use
      # ./enable-db-auth.sh, which creates the accounts first.
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-}
      # Used only when a brand-new database is first created (mongo-init/), to add the app's account.
      - MONGO_APP_USERNAME=${MONGO_APP_USERNAME:-}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD:-}
      - APP_DB_NAME=${DB_NAME:-church_treasury}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    # Only the backend can reach the database, and it has no internet access.
    networks:
      - database
    security_opt:
      - no-new-privileges:true

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=${DB_NAME:-church_treasury}
      # The app's own MongoDB account (read/write on its database only). Empty = no login.
      - MONGO_USERNAME=${MONGO_APP_USERNAME:-}
      - MONGO_PASSWORD=${MONGO_APP_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET}
      # One-time code required to create the first Administrator (see .env)
      - SETUP_CODE=${SETUP_CODE:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
      - BACKUP_DIR=/data/backups
    volumes:
      # Nightly database backups land here. Change the left side to any folder you like.
      - ./backups:/data/backups
    # "treasury" for the web side (and sending email); "database" to reach MongoDB.
    networks:
      - treasury
      - database
    security_opt:
      - no-new-privileges:true
    # The startup script needs only these, to hand the backup folder to the app user and
    # switch to it; the app itself then runs unprivileged.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID

  frontend:
    build:
      context: ./frontend
      args:
        # The browser talks to the backend through the frontend's /api proxy,
        # so the public URL is the frontend origin itself.
        REACT_APP_BACKEND_URL: ${CORS_ORIGINS:-http://localhost:8080}
    restart: unless-stopped
    environment:
      # Where cloudflared connects from. Its CF-Connecting-IP header is trusted only from here.
      - TRUSTED_PROXY=${TRUSTED_PROXY:-172.16.0.0/12}
    depends_on:
      - backend
    ports:
      # Same address as before (http://<server>:8080); nginx now listens on 8080 inside the container.
      - "8080:8080"
    networks:
      - treasury
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  mongo_data:

networks:
  treasury:
    driver: bridge
  # internal: no route to the outside world; only containers on it can connect
  database:
    driver: bridge
    internal: true
