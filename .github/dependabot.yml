# Dependabot opens pull requests when dependencies have updates or security fixes.
# Turn on "Dependabot alerts" and "Dependabot security updates" in the repository's
# Settings → Code security as well.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      js-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Create React App builds with its own bundled Tailwind 3 (react-scripts/node_modules),
      # so the project's tailwindcss version must stay on 3 to match tailwind.config.js and
      # tailwindcss-animate. Tailwind 4 needs a different build setup; revisit with a move to Vite.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    ignore:
      # Node 25 was a short-lived non-LTS release (end of life 2026-06-01). Starting with
      # Node 27, every major release is LTS, so newer majors are still offered.
      - dependency-name: "node"
        versions: [">=25, <26"]
